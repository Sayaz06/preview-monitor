<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Preview">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>KodEdit Preview</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0f0f1a;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
#login{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;gap:10px;background:#0f0f1a;z-index:50}
#login.hide{display:none}
#login h2{color:#4cc9f0;font-size:20px}
#login p{color:#94a3b8;font-size:13px;text-align:center;margin-bottom:8px}
.f{width:100%;max-width:320px;padding:11px 14px;background:#16213e;border:1px solid #2d3748;border-radius:10px;color:#e2e8f0;font-size:14px;outline:none}
.b{width:100%;max-width:320px;padding:12px;border-radius:10px;border:none;background:#7b2ff7;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.b.alt{background:#16213e;border:1px solid #2d3748}
#msg{color:#ef476f;font-size:13px;min-height:18px}
#bar{position:fixed;top:0;left:0;right:0;height:34px;display:flex;align-items:center;gap:6px;padding:0 8px;background:#1a1a2e;border-bottom:1px solid #2d3748;z-index:20;font-size:12px}
#bar.sorok{transform:translateY(-100%)}
#dot{width:9px;height:9px;border-radius:50%;background:#94a3b8;flex-shrink:0}
#dot.on{background:#06d6a0}
#dot.flash{background:#ffd166}
#info{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#94a3b8}
#info b{color:#4cc9f0}
.tb{flex-shrink:0;height:24px;padding:0 8px;border-radius:6px;border:1px solid #2d3748;background:#16213e;color:#e2e8f0;font-size:11px;cursor:pointer}
.tb.on{border-color:#06d6a0;color:#06d6a0}
#tunjuk{position:fixed;top:4px;right:6px;z-index:21;display:none;opacity:.55}
#wrap{position:fixed;top:34px;left:0;right:0;bottom:0;background:#fff}
#wrap.penuh{top:0}
#wrap iframe{width:100%;height:100%;border:0;display:block;background:#fff}
#kosong{position:fixed;top:34px;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;color:#94a3b8;font-size:13px;line-height:1.6;background:#0f0f1a}
#kosong .ik{font-size:44px}
</style>
</head>
<body>

<div id="login">
  <div style="font-size:42px">📡</div>
  <h2>KodEdit Preview</h2>
  <p>Log masuk dengan akaun KodEdit yang sama</p>
  <input class="f" id="em" type="email" placeholder="Email">
  <input class="f" id="pw" type="password" placeholder="Kata laluan">
  <button class="b" onclick="masuk()">Log Masuk</button>
  <input class="f" id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="Admin PIN" style="letter-spacing:4px;text-align:center;margin-top:10px">
  <button class="b alt" onclick="masukPin()">Masuk dengan PIN</button>
  <div id="msg"></div>
</div>

<div id="bar">
  <span id="dot"></span>
  <span id="info">Menunggu...</span>
  <button class="tb on" id="b-auto" onclick="togolAuto()" title="Muat semula automatik bila kod berubah">⟳ Auto</button>
  <button class="tb" onclick="muatSemula()" title="Muat semula sekarang">↻</button>
  <button class="tb" onclick="bukaTab()" title="Buka dalam tab baru">⬀</button>
  <button class="tb" onclick="sorokBar(true)" title="Sorok bar (skrin penuh)">⛶</button>
  <button class="tb" onclick="keluar()" title="Log keluar">⏻</button>
</div>
<button class="tb" id="tunjuk" onclick="sorokBar(false)">▼ bar</button>

<div id="kosong"><div class="ik">📡</div><div id="kosong-teks">Belum ada CURRENT MONITOR.<br>Buka KodEdit › ⊞ Berbilang › tekan <b>📡 Monitor</b> di tepi nama app.</div></div>
<div id="wrap" style="display:none"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
// KodEdit Preview — papar kod CURRENT MONITOR dari KodEdit serta-merta (tanpa tunggu GitHub Pages / cache Chrome)
// Data: users/{uid}/monitor/current + /chunks/{0..n-1} (ditulis oleh KodEdit)
firebase.initializeApp({
  apiKey: "AIzaSyD0hCVXad77dLVERiZLQGn3ne81hQFuqCY",
  authDomain: "stress-places.firebaseapp.com",
  projectId: "stress-places",
  storageBucket: "stress-places.firebasestorage.app",
  messagingSenderId: "137115285004",
  appId: "1:137115285004:web:02d731b7d41012a4d1e029"
});
var auth = firebase.auth(), db = firebase.firestore();
var ADMIN_EMAIL = 'adha86614@gmail.com';
var P = { unsub: null, meta: null, teks: '', v: '', auto: true, tertangguh: false, minta: 0 };
function el(id) { return document.getElementById(id); }

// ── LOG MASUK (sama macam KodEdit) ──
function masuk() {
  var e = el('em').value.trim(), p = el('pw').value;
  if (!e || !p) { el('msg').textContent = 'Isi email dan kata laluan'; return; }
  el('msg').textContent = 'Log masuk...';
  auth.signInWithEmailAndPassword(e, p).then(function() { el('msg').textContent = ''; })
    .catch(function(x) { el('msg').textContent = x.message || x.code; });
}
function masukPin() {
  var pin = el('pin').value.trim();
  if (!pin || pin.length < 4) { el('msg').textContent = 'PIN mesti sekurang-kurangnya 4 digit'; return; }
  el('msg').textContent = 'Mengesahkan PIN...';
  db.collection('admin').doc('pin').get().then(function(d) {
    if (!d.exists || d.data().pin !== pin) { el('msg').textContent = 'PIN salah'; return; }
    return auth.signInWithEmailAndPassword(ADMIN_EMAIL, d.data().pass).then(function() { el('msg').textContent = ''; });
  }).catch(function(x) { el('msg').textContent = 'Gagal: ' + (x.message || x.code); });
}
el('pw').addEventListener('keydown', function(e) { if (e.key === 'Enter') masuk(); });
el('pin').addEventListener('keydown', function(e) { if (e.key === 'Enter') masukPin(); });
function keluar() { if (confirm('Log keluar?')) auth.signOut(); }

auth.onAuthStateChanged(function(u) {
  if (P.unsub) { P.unsub(); P.unsub = null; }
  if (!u) { el('login').classList.remove('hide'); return; }
  el('login').classList.add('hide');
  dengar(u.uid);
});

// ── DENGAR MONITOR ──
function monRef(uid) { return db.collection('users').doc(uid).collection('monitor').doc('current'); }
function dengar(uid) {
  P.unsub = monRef(uid).onSnapshot(function(d) {
    var m = d.exists ? d.data() : null;
    P.meta = m;
    if (!m || m.off || !m.key) { kosong('Belum ada CURRENT MONITOR.<br>Buka KodEdit › ⊞ Berbilang › tekan <b>📡 Monitor</b> di tepi nama app.'); return; }
    if (!m.v || m.menunggu) { kosong('📡 <b>' + esc(m.name || m.key) + '</b> dipilih — menunggu kod dimuat di KodEdit...'); return; }
    if (m.v === P.v) return;
    ambil(uid, m);
  }, function(e) { kosong('✕ Gagal dengar: ' + esc(e.code || e.message) + '<br>Semak Firestore Rules: users/{uid}/monitor/**'); });
}
function ambil(uid, m) {
  var no = ++P.minta, ref = monRef(uid).collection('chunks'), tugas = [], i;
  el('dot').className = 'flash';
  el('info').innerHTML = '<b>' + esc(m.name || '') + '</b> · memuat ' + saiz(m.size) + '...';
  for (i = 0; i < m.n; i++) tugas.push(ref.doc(String(i)).get());
  Promise.all(tugas).then(function(sn) {
    if (no !== P.minta) return; // ada versi lebih baru sedang dimuat
    var bahagian = [], k, x;
    for (k = 0; k < sn.length; k++) {
      x = sn[k].exists ? sn[k].data() : null;
      if (!x || x.v !== m.v) return; // kod berubah lagi semasa dimuat — tunggu snapshot seterusnya
      bahagian.push(x.t || '');
    }
    P.teks = bahagian.join(''); P.v = m.v;
    if (P.auto || !el('wrap').firstChild) papar();
    else { P.tertangguh = true; statusBar(true); }
  }).catch(function(e) { el('dot').className = ''; el('info').textContent = '✕ ' + (e.code || e.message); });
}

// ── PAPAR dalam iframe (iframe baru setiap kali → JS app bermula semula dengan bersih) ──
function asasUrl(m) {
  var r = String(m.repo || '').split('/'), dir = String(m.path || '').split('/').slice(0, -1).join('/');
  if (r.length < 2) return '';
  return 'https://' + r[0].toLowerCase() + '.github.io/' + r[1] + '/' + (dir ? dir + '/' : '');
}
function denganBase(html, m) {
  var b = asasUrl(m);
  if (!b || /<base\s/i.test(html)) return html;
  var tag = '<base href="' + b + '">';
  if (/<head[^>]*>/i.test(html)) return html.replace(/<head([^>]*)>/i, '<head$1>' + tag); // fail relatif (manifest, ikon, js) dimuat dari GitHub Pages
  return tag + html;
}
function papar() {
  var w = el('wrap'), f = document.createElement('iframe');
  f.setAttribute('allow', 'autoplay; clipboard-read; clipboard-write; microphone; camera; geolocation; fullscreen');
  f.srcdoc = denganBase(P.teks, P.meta || {});
  w.innerHTML = ''; w.appendChild(f);
  w.style.display = ''; el('kosong').style.display = 'none';
  P.tertangguh = false;
  statusBar(false);
}
function statusBar(baru) {
  var m = P.meta || {}, t = new Date(m.at || Date.now());
  el('dot').className = baru ? 'flash' : 'on';
  el('info').innerHTML = '<b>' + esc(m.name || '') + '</b> · ' + esc(m.path || '') + ' · ' + saiz(m.size) + ' · ' +
    t.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + (baru ? ' · <b style="color:#ffd166">KOD BARU — tekan ↻</b>' : '');
}
function kosong(h) {
  el('wrap').style.display = 'none'; el('wrap').innerHTML = '';
  el('kosong').style.display = ''; el('kosong-teks').innerHTML = h;
  el('dot').className = ''; el('info').textContent = 'Tiada monitor';
  P.v = ''; P.teks = '';
}

// ── BUTANG BAR ──
function togolAuto() {
  P.auto = !P.auto;
  el('b-auto').className = 'tb' + (P.auto ? ' on' : '');
  if (P.auto && P.tertangguh) papar();
}
function muatSemula() { if (P.teks) papar(); }
function bukaTab() {
  if (!P.teks) return;
  var url = URL.createObjectURL(new Blob([denganBase(P.teks, P.meta || {})], { type: 'text/html;charset=utf-8' }));
  window.open(url, '_blank');
  setTimeout(function() { URL.revokeObjectURL(url); }, 15000);
}
function sorokBar(s) {
  el('bar').className = s ? 'sorok' : '';
  el('wrap').className = s ? 'penuh' : '';
  el('tunjuk').style.display = s ? 'block' : 'none';
}
function saiz(b) { b = b || 0; return b >= 1048576 ? (b / 1048576).toFixed(1) + 'MB' : b >= 1024 ? Math.round(b / 1024) + 'KB' : b + 'B'; }
function esc(s) { return String(s).replace(/[&<>"]/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

// ── PWA: service worker (skop app Preview sahaja) ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function(e) { console.log('SW gagal:', e); });
  });
}
</script>
</body>
</html>
